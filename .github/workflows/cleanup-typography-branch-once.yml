name: Remove merged typography branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-typography-branch-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'thomasasen/saleskpis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete merged typography branch if PR 8 merged and SHA unchanged
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/typography-readability-20261013'
          expected='bca22c742fa33434232dd80ba2611d54cdc7645c'
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/8" --jq '.merged_at')"
          test -n "$merged" && test "$merged" != 'null'
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$head" = "$expected"
          gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
